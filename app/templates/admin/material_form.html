{% extends "base.html" %}

{% block title %}
{% if edit_mode %}
Edit Materi
{% else %}
Tambah Materi
{% endif %}
• Banua Edu
{% endblock %}

{% block content %}

<style>

.wrap {
    max-width:850px;
    margin:auto;
    padding:30px 20px 60px;
}

.card {
    background:white;
    border:1px solid #e2e8f0;
    border-radius:24px;
    padding:30px;
    box-shadow:0 10px 30px rgba(15,23,42,.06);
}

h1 {
    margin:0;
    color:#0f172a;
}

.sub {
    color:#64748b;
    margin:8px 0 25px;
}

.field {
    margin-bottom:18px;
}

label {
    display:block;
    margin-bottom:7px;
    color:#334155;
    font-weight:700;
    font-size:14px;
}

input,
select,
textarea {
    width:100%;
    box-sizing:border-box;
    padding:13px 14px;
    border:1px solid #cbd5e1;
    border-radius:12px;
    font:inherit;
}

textarea {
    min-height:220px;
    resize:vertical;
}

.actions {
    display:flex;
    gap:10px;
    margin-top:25px;
}

.btn {
    border:0;
    border-radius:12px;
    padding:12px 18px;
    text-decoration:none;
    cursor:pointer;
    font-weight:700;
}

.save {
    background:#2563eb;
    color:white;
}

.cancel {
    background:#f1f5f9;
    color:#334155;
}

@media(max-width:600px) {

    .wrap {
        padding:20px 12px 40px;
    }

    .card {
        padding:21px 18px;
        border-radius:20px;
    }

    .actions {
        flex-direction:column;
    }

    .actions .btn {
        text-align:center;
    }

}

</style>


<div class="wrap">

    <div class="card">

        <h1>

            {% if edit_mode %}
                ✏️ Edit Materi
            {% else %}
                📖 Tambah Materi
            {% endif %}

        </h1>

        <p class="sub">
            Kelola materi pembelajaran Banua Edu.
        </p>


        <form method="POST">


            <div class="field">

                <label>
                    Mata Pelajaran
                </label>

                <select
                    name="subject_id"
                    required
                >

                    <option value="">
                        -- Pilih Mata Pelajaran --
                    </option>

                    {% for subject in subjects %}

                    <option
                        value="{{ subject.id }}"
                        {% if material and material.subject_id == subject.id %}
                            selected
                        {% endif %}
                    >
                        {{ subject.nama }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <div class="field">

                <label>
                    Judul Materi
                </label>

                <input
                    type="text"
                    name="judul"
                    value="{{ material.judul if material else '' }}"
                    placeholder="Contoh: Bilangan Dasar"
                    required
                >

            </div>


            <div class="field">

                <label>
                    Isi Materi
                </label>

                <textarea
                    name="isi"
                    placeholder="Tulis isi materi pembelajaran..."
                >{{ material.isi if material else '' }}</textarea>

            </div>


            <div class="field">

                <label>
                    URL Video
                </label>

                <input
                    type="url"
                    name="video_url"
                    value="{{ material.video_url if material else '' }}"
                    placeholder="https://youtube.com/..."
                >

            </div>


            <div class="field">

                <label>
                    URL PDF
                </label>

                <input
                    type="url"
                    name="pdf_url"
                    value="{{ material.pdf_url if material else '' }}"
                    placeholder="https://..."
                >

            </div>


            <div class="field">

                <label>
                    Urutan Materi
                </label>

                <input
                    type="number"
                    name="urutan"
                    min="1"
                    value="{{ material.urutan if material else 1 }}"
                >

            </div>


            <div class="actions">

                <button
                    type="submit"
                    class="btn save"
                >
                    💾
                    {% if edit_mode %}
                        Simpan Perubahan
                    {% else %}
                        Simpan Materi
                    {% endif %}
                </button>

                <a
                    href="{{ url_for('admin.materials') }}"
                    class="btn cancel"
                >
                    Batal
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
