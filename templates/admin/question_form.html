{% extends "base.html" %}

{% block title %}
{% if edit_mode %}
Edit Soal
{% else %}
Tambah Soal
{% endif %}
• Banua Edu
{% endblock %}

{% block content %}

<style>

.wrap {
    max-width:850px;
    margin:auto;
    padding:30px 20px 60px;
}

.card {
    background:white;
    border:1px solid #e2e8f0;
    border-radius:24px;
    padding:30px;
    box-shadow:0 10px 30px rgba(15,23,42,.06);
}

h1 {
    margin:0;
    color:#0f172a;
}

.sub {
    color:#64748b;
    margin:8px 0 25px;
}

.field {
    margin-bottom:18px;
}

label {
    display:block;
    margin-bottom:7px;
    color:#334155;
    font-weight:700;
    font-size:14px;
}

input,
select,
textarea {
    width:100%;
    box-sizing:border-box;
    padding:13px 14px;
    border:1px solid #cbd5e1;
    border-radius:12px;
    font:inherit;
}

textarea {
    min-height:130px;
    resize:vertical;
}

.answer-grid {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.answer-option {
    border:1px solid #cbd5e1;
    border-radius:12px;
    padding:12px;
}

.actions {
    display:flex;
    gap:10px;
    margin-top:25px;
}

.btn {
    border:0;
    border-radius:12px;
    padding:12px 18px;
    text-decoration:none;
    cursor:pointer;
    font-weight:700;
}

.save {
    background:#2563eb;
    color:white;
}

.cancel {
    background:#f1f5f9;
    color:#334155;
}

@media(max-width:600px) {

    .wrap {
        padding:20px 12px 40px;
    }

    .card {
        padding:21px 18px;
        border-radius:20px;
    }

    .answer-grid {
        grid-template-columns:1fr 1fr;
    }

    .actions {
        flex-direction:column;
    }

    .actions .btn {
        text-align:center;
    }

}

</style>


<div class="wrap">

    <div class="card">

        <h1>

            {% if edit_mode %}
                ✏️ Edit Soal
            {% else %}
                ❓ Tambah Soal
            {% endif %}

        </h1>

        <p class="sub">
            Buat soal pilihan ganda untuk ujian.
        </p>


        <form method="POST">


            <div class="field">

                <label>
                    Ujian
                </label>

                <select
                    name="quiz_id"
                    required
                >

                    <option value="">
                        -- Pilih Ujian --
                    </option>

                    {% for quiz in quizzes %}

                    <option
                        value="{{ quiz.id }}"
                        {% if question and question.quiz_id == quiz.id %}
                            selected
                        {% endif %}
                    >
                        {{ quiz.judul }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <div class="field">

                <label>
                    Pertanyaan
                </label>

                <textarea
                    name="pertanyaan"
                    placeholder="Tuliskan pertanyaan..."
                    required
                >{{ question.pertanyaan if question else '' }}</textarea>

            </div>


            <div class="field">

                <label>
                    Pilihan A
                </label>

                <input
                    type="text"
                    name="opsi_a"
                    value="{{ question.opsi_a if question else '' }}"
                    required
                >

            </div>


            <div class="field">

                <label>
                    Pilihan B
                </label>

                <input
                    type="text"
                    name="opsi_b"
                    value="{{ question.opsi_b if question else '' }}"
                    required
                >

            </div>


            <div class="field">

                <label>
                    Pilihan C
                </label>

                <input
                    type="text"
                    name="opsi_c"
                    value="{{ question.opsi_c if question else '' }}"
                    required
                >

            </div>


            <div class="field">

                <label>
                    Pilihan D
                </label>

                <input
                    type="text"
                    name="opsi_d"
                    value="{{ question.opsi_d if question else '' }}"
                    required
                >

            </div>


            <div class="field">

                <label>
                    Jawaban Benar
                </label>

                <div class="answer-grid">

                    <label class="answer-option">
                        <input
                            type="radio"
                            name="jawaban"
                            value="a"
                            {% if question and question.jawaban|lower == 'a' %}
                                checked
                            {% endif %}
                            required
                        >
                        A
                    </label>

                    <label class="answer-option">
                        <input
                            type="radio"
                            name="jawaban"
                            value="b"
                            {% if question and question.jawaban|lower == 'b' %}
                                checked
                            {% endif %}
                        >
                        B
                    </label>

                    <label class="answer-option">
                        <input
                            type="radio"
                            name="jawaban"
                            value="c"
                            {% if question and question.jawaban|lower == 'c' %}
                                checked
                            {% endif %}
                        >
                        C
                    </label>

                    <label class="answer-option">
                        <input
                            type="radio"
                            name="jawaban"
                            value="d"
                            {% if question and question.jawaban|lower == 'd' %}
                                checked
                            {% endif %}
                        >
                        D
                    </label>

                </div>

            </div>


            <div class="actions">

                <button
                    type="submit"
                    class="btn save"
                >
                    💾
                    {% if edit_mode %}
                        Simpan Perubahan
                    {% else %}
                        Simpan Soal
                    {% endif %}
                </button>

                <a
                    href="{{ url_for('admin.questions') }}"
                    class="btn cancel"
                >
                    Batal
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
